name: signallens

services:
  postgres:
    image: postgres:16-alpine
    container_name: signallens_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: signallens
      POSTGRES_USER: signallens
      POSTGRES_PASSWORD: signallens_dev
    ports:
      - "55433:5432"
    volumes:
      - signallens_postgres_data:/var/lib/postgresql/data

volumes:
  signallens_postgres_data: